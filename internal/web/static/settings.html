    <h1><span class="brand-name">Freeway&nbsp;Pi</span><span class="brand-page" data-i18n="ui.the.unit">Aggregatet</span></h1>
  </a>
  <div class="head-right">
    <button id="logout" class="link-button" hidden data-i18n="ui.logout">Logg ut</button>
    <button id="menu-button" class="icon-button" aria-label="Meny" data-i18n-aria-label="ui.menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

<nav id="menu" class="menu" hidden>

<main>
  <div id="banner" class="banner" hidden><span id="banner-text"></span></div>

  <!-- Three states, one at a time: no PIN yet, locked, or open. -->
  <section class="card" id="gate" hidden>
    <div class="card-label" id="gate-label" data-i18n="ui.locked">Låst</div>
    <p class="gate-help" id="gate-help"></p>
    <form class="gate-form" id="gate-form">
      <input type="password" id="pin" inputmode="numeric" autocomplete="current-password"
             placeholder="PIN eller passord" data-i18n-placeholder="ui.pin.placeholder" aria-label="PIN eller passord" data-i18n-aria-label="ui.pin.placeholder">
      <button type="submit" class="primary" id="gate-submit" data-i18n="ui.unlock">Lås opp</button>
    </form>
    <p class="gate-note" id="gate-note"></p>
  </section>

  <div id="settings"></div>
</main>

<script src="crypto.js"></script>
  <script src="gate.js"></script>
<script src="clock.js"></script>
<script src="settings.js"></script>
