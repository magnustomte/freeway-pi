# Keep the system journal across restarts.
#
# Raspberry Pi OS ships Storage=volatile to spare the memory card, which is a
# fair trade on a machine somebody is sitting in front of: the log is in memory
# while it is needed and gone when the machine is off.
#
# It is the wrong trade here. This box restarts itself — after an update, when
# the owner has chosen that — and it is powered by whatever supply is to hand,
# so it also restarts when it is not asked to. In both cases the only record of
# why is the one that has just been thrown away, and what is left is a machine
# that was up a moment ago and now is not, with nothing to read.
#
# Capped hard rather than left to the default, which is a share of the
# filesystem and would be hundreds of megabytes here. Thirty-two megabytes is a
# few days on a box this quiet, rotated in eight-megabyte files, and the writes
# are a rounding error beside the measurements the history database is already
# committing every ten seconds.
#
# Sorted after 40-rpi-volatile-storage.conf on purpose: drop-ins are read in
# filename order and the last word wins.
[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=8M
